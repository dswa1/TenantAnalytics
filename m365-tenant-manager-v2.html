                            onClick={onFetchData}
                            disabled={loading}
                            style={{ height: 'fit-content' }}
                        >
                            {loading ? 'Loading...' : '🔄 Fetch Live Data'}
                        </button>
                    </div>

                    {error && (
                        <div className="alert error" style={{ marginBottom: '1.5rem' }}>
                            ❌ Error: {error}
                        </div>
                    )}

                    {loading && (
                        <div className="alert info" style={{ marginBottom: '1.5rem' }}>
                            ⏳ Fetching data from Microsoft Graph API...
                        </div>
                    )}

                    <div className="dashboard-nav">
                        <div className={`nav-tab ${tab === 'overview' ? 'active' : ''}`} onClick={() => setTab('overview')}>
                            Overview
                        </div>
                        <div className={`nav-tab ${tab === 'users' ? 'active' : ''}`} onClick={() => setTab('users')}>
                            Users & Licenses
                        </div>
                        <div className={`nav-tab ${tab === 'security' ? 'active' : ''}`} onClick={() => setTab('security')}>
                            Security
                        </div>
                        <div className={`nav-tab ${tab === 'mailboxes' ? 'active' : ''}`} onClick={() => setTab('mailboxes')}>
                            Mailboxes
                        </div>
                        <div className={`nav-tab ${tab === 'apps' ? 'active' : ''}`} onClick={() => setTab('apps')}>
                            App Usage
                        </div>
                    </div>

                    {tab === 'overview' && <OverviewTab stats={stats} />}
                    {tab === 'users' && <UsersTab users={users} />}
                    {tab === 'security' && <SecurityTab stats={stats} riskyUsers={riskyUsers} />}
                    {tab === 'mailboxes' && <MailboxesTab users={users} />}
                    {tab === 'apps' && <AppUsageTab />}
                </div>
            );
        }

        // Dashboard Tab Components (same as before)
        function OverviewTab({ stats }) {
            return (
                <>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-label">Total Users</div>
                            <div className="stat-value">{stats.totalUsers}</div>
                            <div className="stat-change positive">↑ 3 this month</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Licensed Users</div>
                            <div className="stat-value">{stats.licensedUsers}</div>
                            <div className="stat-change">{stats.unusedLicenses} unused licenses</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Active Users (30d)</div>
                            <div className="stat-value">{stats.activeUsers}</div>
                            <div className="stat-change positive">↑ 8% vs last month</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Security Score</div>
                            <div className="stat-value">{stats.securityScore}%</div>
                            <div className="stat-change positive">↑ 5% improvement</div>
                        </div>
                    </div>

                    <div className="alert warning">
                        ⚠️ {stats.riskyUsers} risky users detected • {stats.inactiveMailboxes} inactive mailboxes consuming licenses
                    </div>
                </>
            );
        }

        function UsersTab({ users }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
            const [licenseFilter, setLicenseFilter] = useState('all');

            const filteredUsers = users.filter(user => {
                const matchesSearch = user.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    user.email.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesStatus = statusFilter === 'all' || user.status === statusFilter;
                const matchesLicense = licenseFilter === 'all' ||
                                     (licenseFilter === 'licensed' && user.licensed) ||
                                     (licenseFilter === 'unlicensed' && !user.licensed);
                return matchesSearch && matchesStatus && matchesLicense;
            });

            return (
                <div className="data-table-container">
                    <div className="table-header">
                        <h3>User Management ({filteredUsers.length} of {users.length} users)</h3>
                        <div className="table-actions">
                            <button className="icon-btn">Export CSV</button>
                            <button className="icon-btn">Refresh Data</button>
                        </div>
                    </div>

                    <div style={{ padding: '1rem', display: 'flex', gap: '1rem', alignItems: 'center', borderBottom: '1px solid var(--border)' }}>
                        <input
                            type="text"
                            placeholder="🔍 Search users by name or email..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            style={{
                                flex: 1,
                                padding: '0.5rem 1rem',
                                border: '1px solid var(--border)',
                                borderRadius: '4px',
                                backgroundColor: 'var(--bg-secondary)',
                                color: 'var(--text-primary)'
                            }}
                        />
                        <select
                            value={statusFilter}
                            onChange={(e) => setStatusFilter(e.target.value)}
                            style={{
                                padding: '0.5rem 1rem',
                                border: '1px solid var(--border)',
                                borderRadius: '4px',
                                backgroundColor: 'var(--bg-secondary)',
                                color: 'var(--text-primary)'
                            }}
                        >
                            <option value="all">All Status</option>
                            <option value="active">Active Only</option>
                            <option value="inactive">Inactive Only</option>
                        </select>
                        <select
                            value={licenseFilter}
                            onChange={(e) => setLicenseFilter(e.target.value)}
                            style={{
                                padding: '0.5rem 1rem',
                                border: '1px solid var(--border)',
                                borderRadius: '4px',
                                backgroundColor: 'var(--bg-secondary)',
                                color: 'var(--text-primary)'
                            }}
                        >
                            <option value="all">All Licenses</option>
                            <option value="licensed">Licensed Only</option>
                            <option value="unlicensed">Unlicensed Only</option>
                        </select>
                    </div>

                    <table className="data-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Licensed</th>
                                <th>Last Active</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {filteredUsers.map(user => (
                                <tr key={user.id}>
                                    <td>{user.name}</td>
                                    <td>{user.email}</td>
                                    <td>
                                        <span className={`status-badge ${user.licensed ? 'active' : 'inactive'}`}>
                                            {user.licensed ? 'Yes' : 'No'}
                                        </span>
                                    </td>
                                    <td>{user.lastActive}</td>
                                    <td>
                                        <span className={`status-badge ${user.status}`}>
                                            {user.status}
                                        </span>
                                    </td>
                                    <td>
                                        <button className="action-btn">View Details</button>
                                        <button className="action-btn danger">Block</button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function SecurityTab({ stats, riskyUsers }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [riskLevelFilter, setRiskLevelFilter] = useState('all');
            const [severityFilter, setSeverityFilter] = useState('all');

            // Check if we have real data (even if it's empty)
            const hasRealData = riskyUsers !== undefined && riskyUsers !== null;
            const riskyUsersList = riskyUsers || [];

            const filteredRiskyUsers = riskyUsersList.filter(user => {
                const matchesSearch = user.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    user.email.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesRiskLevel = riskLevelFilter === 'all' ||
                                       user.riskLevel.toLowerCase() === riskLevelFilter.toLowerCase();
                return matchesSearch && matchesRiskLevel;
            });

            const securityRecommendations = [
                {
                    id: 1,
                    title: 'Enable MFA for all users',
                    severity: 'high',
                    impact: 'High',
                    status: 'pending',
                    description: '15 users do not have MFA enabled'
                },
                {
                    id: 2,
                    title: 'Review risky sign-ins',
                    severity: 'critical',
                    impact: 'Critical',
                    status: 'pending',
                    description: '3 users with suspicious activity detected'
                },
                {
                    id: 3,
                    title: 'Update conditional access policies',
                    severity: 'medium',
                    impact: 'Medium',
                    status: 'in-progress',
                    description: 'Add location-based access restrictions'
                },
                {
                    id: 4,
                    title: 'Review admin role assignments',
                    severity: 'high',
                    impact: 'High',
                    status: 'pending',
                    description: '2 users with unnecessary admin privileges'
                },
                {
                    id: 5,
                    title: 'Enable password protection',
                    severity: 'medium',
                    impact: 'Medium',
                    status: 'completed',
                    description: 'Block common and weak passwords'
                }
            ];

            return (
                <>
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-label">Security Score</div>
                            <div className="stat-value">{stats.securityScore}%</div>
                            <div className="stat-change positive">↑ 5 points</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Risky Users</div>
                            <div className="stat-value">{stats.riskyUsers}</div>
                            <div className="stat-change negative">↑ 2 new alerts</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Non-Compliant Devices</div>
                            <div className="stat-value">8</div>
                            <div className="stat-change warning">Needs attention</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">Conditional Access Policies</div>
                            <div className="stat-value">12</div>
                            <div className="stat-change">5 active</div>
                        </div>
                    </div>

                    {stats.riskyUsers > 0 && (
                        <div className="alert error" style={{ marginBottom: '2rem' }}>
                            🚨 Critical: {stats.riskyUsers} risky users detected - Review and take action immediately
                        </div>
                    )}

                    <div className="data-table-container" style={{ marginBottom: '2rem' }}>
                        <div className="table-header">
                            <h3>Risky Users ({filteredRiskyUsers.length} of {riskyUsersList.length})</h3>
                            <div className="table-actions">
                                {riskyUsersList.length > 0 && (
                                    <>
                                        <button className="icon-btn">Dismiss All</button>
                                        <button className="icon-btn">Export Report</button>
                                    </>
                                )}
                            </div>
                        </div>

                        {riskyUsersList.length > 0 && (
                            <div style={{ padding: '1rem', display: 'flex', gap: '1rem', alignItems: 'center', borderBottom: '1px solid var(--border)' }}>
                                <input
                                    type="text"
                                    placeholder="🔍 Search risky users..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    style={{
                                        flex: 1,
                                        padding: '0.5rem 1rem',
                                        border: '1px solid var(--border)',
                                        borderRadius: '4px',
                                        backgroundColor: 'var(--bg-secondary)',
                                        color: 'var(--text-primary)'
                                    }}
                                />
                                <select
                                    value={riskLevelFilter}
                                    onChange={(e) => setRiskLevelFilter(e.target.value)}
                                    style={{
                                        padding: '0.5rem 1rem',
                                        border: '1px solid var(--border)',
                                        borderRadius: '4px',
                                        backgroundColor: 'var(--bg-secondary)',
                                        color: 'var(--text-primary)'
                                    }}
                                >
                                    <option value="all">All Risk Levels</option>
                                    <option value="high">High Only</option>
                                    <option value="medium">Medium Only</option>
                                    <option value="low">Low Only</option>
                                </select>
                            </div>
                        )}

                        {riskyUsersList.length === 0 && hasRealData ? (
                            <div className="alert info" style={{ margin: '1rem' }}>
                                ✅ Great news! No risky users detected in your tenant. Your security posture is looking good.
                            </div>
                        ) : riskyUsersList.length === 0 ? (
                            <div className="alert warning" style={{ margin: '1rem' }}>
                                ⏳ Click "Fetch Live Data" to load risky users from your tenant
                            </div>
                        ) : (
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th>User</th>
                                        <th>Email</th>
                                        <th>Risk Level</th>
                                        <th>Risk Reason</th>
                                        <th>Last Risky Sign-In</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {riskyUsersList.map(user => (
                                        <tr key={user.id}>
                                            <td>{user.name}</td>
                                            <td>{user.email}</td>
                                            <td>
                                                <span className={`status-badge ${user.riskLevel === 'High' || user.riskLevel === 'high' ? 'inactive' : user.riskLevel === 'Medium' || user.riskLevel === 'medium' ? 'warning' : 'active'}`}>
                                                    {user.riskLevel}
                                                </span>
                                            </td>
                                            <td>{user.riskReason}</td>
                                            <td>{user.lastRiskySignIn}</td>
                                            <td>
                                                <button className="action-btn">Confirm Safe</button>
                                                <button className="action-btn danger">Block User</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>

                    <div className="data-table-container">
                        <div className="table-header">
                            <h3>Security Recommendations</h3>
                            <div className="table-actions">
                                <button className="icon-btn">Apply All</button>
                            </div>
                        </div>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Recommendation</th>
                                    <th>Severity</th>
                                    <th>Impact</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {securityRecommendations.map(rec => (
                                    <tr key={rec.id}>
                                        <td>
                                            <div style={{ fontWeight: '600', marginBottom: '0.25rem' }}>{rec.title}</div>
                                            <div style={{ fontSize: '0.85rem', color: 'var(--text-secondary)' }}>{rec.description}</div>
                                        </td>
                                        <td>
                                            <span className={`status-badge ${rec.severity === 'critical' ? 'inactive' : rec.severity === 'high' ? 'warning' : 'active'}`}>
                                                {rec.severity.toUpperCase()}
                                            </span>
                                        </td>
                                        <td>{rec.impact}</td>
                                        <td>
                                            <span className={`status-badge ${rec.status === 'completed' ? 'active' : rec.status === 'in-progress' ? 'warning' : 'inactive'}`}>
                                                {rec.status === 'in-progress' ? 'In Progress' : rec.status.charAt(0).toUpperCase() + rec.status.slice(1)}
                                            </span>
                                        </td>
                                        <td>
                                            {rec.status !== 'completed' && (
                                                <>
                                                    <button className="action-btn">Apply</button>
                                                    <button className="action-btn">Dismiss</button>
                                                </>
                                            )}
                                            {rec.status === 'completed' && (
                                                <button className="action-btn">View Details</button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </>
            );
        }

        function MailboxesTab({ users }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');

            const filteredUsers = users.filter(user => {
                const matchesSearch = user.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    user.email.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesStatus = statusFilter === 'all' || user.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            return (
                <div className="data-table-container">
                    <div className="table-header">
                        <h3>Mailbox Management ({filteredUsers.length} of {users.length} mailboxes)</h3>
                        <div className="table-actions">
                            <button className="icon-btn">Find Inactive</button>
                            <button className="icon-btn">Export Report</button>
                        </div>
                    </div>

                    <div style={{ padding: '1rem', display: 'flex', gap: '1rem', alignItems: 'center', borderBottom: '1px solid var(--border)' }}>
                        <input
                            type="text"
                            placeholder="🔍 Search mailboxes by user or email..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            style={{
                                flex: 1,
                                padding: '0.5rem 1rem',
                                border: '1px solid var(--border)',
                                borderRadius: '4px',
                                backgroundColor: 'var(--bg-secondary)',
                                color: 'var(--text-primary)'
                            }}
                        />
                        <select
                            value={statusFilter}
                            onChange={(e) => setStatusFilter(e.target.value)}
                            style={{
                                padding: '0.5rem 1rem',
                                border: '1px solid var(--border)',
                                borderRadius: '4px',
                                backgroundColor: 'var(--bg-secondary)',
                                color: 'var(--text-primary)'
                            }}
                        >
                            <option value="all">All Status</option>
                            <option value="active">Active Only</option>
                            <option value="inactive">Inactive Only</option>
                        </select>
                    </div>

                    <table className="data-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Mailbox Size</th>
                                <th>Last Active</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {filteredUsers.map(user => (
                                <tr key={user.id}>
                                    <td>{user.name}</td>
                                    <td>{user.email}</td>
                                    <td>{user.mailboxSize}</td>
                                    <td>{user.lastActive}</td>
                                    <td>
                                        <span className={`status-badge ${user.status}`}>
                                            {user.status}
                                        </span>
                                    </td>
                                    <td>
                                        <button className="action-btn">Archive</button>
                                        {user.status === 'inactive' && (
                                            <button className="action-btn danger">Delete</button>
                                        )}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function AppUsageTab() {
            const appUsage = [
                { app: 'Microsoft Teams', users: 189, growth: 12, status: 'active' },
                { app: 'SharePoint Online', users: 156, growth: 5, status: 'active' },
                { app: 'OneDrive', users: 201, growth: 8, status: 'active' },
                { app: 'Exchange Online', users: 234, growth: 3, status: 'active' },
                { app: 'Power BI', users: 45, growth: -2, status: 'warning' },
            ];

            return (
                <div className="data-table-container">
                    <div className="table-header">
                        <h3>Application Usage (30 days)</h3>
                        <div className="table-actions">
                            <button className="icon-btn">Export Data</button>
                        </div>
                    </div>
                    <table className="data-table">
                        <thead>
                            <tr>
                                <th>Application</th>
                                <th>Active Users</th>
                                <th>Growth</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {appUsage.map((app, idx) => (
                                <tr key={idx}>
                                    <td>{app.app}</td>
                                    <td>{app.users}</td>
                                    <td>
                                        <span className={`stat-change ${app.growth >= 0 ? 'positive' : 'negative'}`}>
                                            {app.growth >= 0 ? '↑' : '↓'} {Math.abs(app.growth)}%
                                        </span>
                                    </td>
                                    <td>
                                        <span className={`status-badge ${app.status}`}>
                                            {app.status}
                                        </span>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
